name: Monitor de Estado Multirregión (Uptime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-regions:
    strategy:
      matrix:
        include:
          - region: US
            os: ubuntu-latest
          - region: EU
            os: windows-latest
          - region: ASIA
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Ping a los servicios y medir latencia
        run: |
          check_service() {
            local url=$1
            local res=$(curl -L -k -m 10 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' -o /dev/null -s -w "%{http_code} %{time_total}" "$url" || echo "000 0")
            local code=$(echo "$res" | awk '{print $1}')
            local time_sec=$(echo "$res" | awk '{print $2}')
            local time_ms=$(jq -n --arg t "$time_sec" '($t | tonumber * 1000) | round')

            local status="DOWN"
            if [[ "$code" =~ ^(200|301|302|403|503)$ ]]; then
              status="UP"
            fi
            echo "{\"status\": \"$status\", \"latency\": $time_ms}"
          }

          echo "{}" > region_data.json
          
          jq -c '.[]' targets.json | while read i; do
            ID=$(echo "$i" | jq -r '.id')
            URL=$(echo "$i" | jq -r '.url')
            RES=$(check_service "$URL")
            jq --arg id "$ID" --argjson res "$RES" '.[$id] = $res' region_data.json > tmp.json && mv tmp.json region_data.json
          done
          
          jq --arg reg "${{ matrix.region }}" '{region: $reg} + .' region_data.json > ${{ matrix.region }}.json

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v5
        with:
          name: result-${{ matrix.region }}
          path: ${{ matrix.region }}.json
          retention-days: 1

  merge-and-publish:
    needs: ping-regions
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Descargar artefactos regionales
        uses: actions/download-artifact@v5
        with:
          pattern: result-*
          merge-multiple: true

      - name: Unificar datos, generar carpetas dinámicas (Incidencias y Mantenimientos)
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p history
          
          echo "{\"last_check\": \"$TIMESTAMP\", \"components\": []}" > data.json
          
          jq -c '.[]' targets.json | while read i; do
            ID=$(echo "$i" | jq -r '.id')
            NAME_ES=$(echo "$i" | jq -r '.name_es')
            NAME_EN=$(echo "$i" | jq -r '.name_en')
            URL=$(echo "$i" | jq -r '.url')
            
            ST_US=$(jq -c --arg id "$ID" '.[$id]' US.json)
            if [ "$ST_US" == "null" ] || [ -z "$ST_US" ]; then ST_US='{"status":"DOWN","latency":0}'; fi
            
            ST_EU=$(jq -c --arg id "$ID" '.[$id]' EU.json)
            if [ "$ST_EU" == "null" ] || [ -z "$ST_EU" ]; then ST_EU='{"status":"DOWN","latency":0}'; fi
            
            ST_AS=$(jq -c --arg id "$ID" '.[$id]' ASIA.json)
            if [ "$ST_AS" == "null" ] || [ -z "$ST_AS" ]; then ST_AS='{"status":"DOWN","latency":0}'; fi
            
            HFILE="history/$ID.json"
            OLD_HIST="[]"
            if [ -f "$HFILE" ]; then OLD_HIST=$(cat "$HFILE"); fi
            
            jq -n --arg ts "$TIMESTAMP" --argjson us "$ST_US" --argjson eu "$ST_EU" --argjson as "$ST_AS" --argjson old "$OLD_HIST" \
              '($old + [{timestamp: $ts, US: $us, EU: $eu, ASIA: $as}])[-105120:]' > "$HFILE"
              
            jq --arg id "$ID" --arg name_es "$NAME_ES" --arg name_en "$NAME_EN" --arg url "$URL" --arg hfile "$HFILE" \
               --argjson us "$ST_US" --argjson eu "$ST_EU" --argjson as "$ST_AS" \
               '.components += [{id: $id, name_es: $name_es, name_en: $name_en, url: $url, regions: {US: $us, EU: $eu, ASIA: $as}, history_file: $hfile}]' data.json > tmp.json && mv tmp.json data.json
               
            # Carpetas dinámicas para Incidencias y Mantenimientos
            mkdir -p "incidents/$ID"
            touch "incidents/$ID/.gitkeep"
            
            mkdir -p "maintenances/$ID"
            touch "maintenances/$ID/.gitkeep"
          done

          # Procesar INCIDENCIAS
          shopt -s nullglob
          inc_files=(incidents/*/*.json)
          for file in "${inc_files[@]}"; do
            if [ -f "$file" ]; then
              if ! iconv -f UTF-8 -t UTF-8 "$file" >/dev/null 2>&1; then
                iconv -f WINDOWS-1252 -t UTF-8 "$file" > "$file.utf8" && mv "$file.utf8" "$file"
              fi
            fi
          done
          if [ ${#inc_files[@]} -gt 0 ]; then
            jq -s 'sort_by(.start_time) | reverse' "${inc_files[@]}" > incidents-index.json
          else
            echo "[]" > incidents-index.json
          fi

          # Procesar MANTENIMIENTOS
          maint_files=(maintenances/*/*.json)
          for file in "${maint_files[@]}"; do
            if [ -f "$file" ]; then
              if ! iconv -f UTF-8 -t UTF-8 "$file" >/dev/null 2>&1; then
                iconv -f WINDOWS-1252 -t UTF-8 "$file" > "$file.utf8" && mv "$file.utf8" "$file"
              fi
            fi
          done
          if [ ${#maint_files[@]} -gt 0 ]; then
            jq -s 'sort_by(.start_time) | reverse' "${maint_files[@]}" > maintenances-index.json
          else
            echo "[]" > maintenances-index.json
          fi
          shopt -u nullglob

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history/ incidents/ incidents-index.json maintenances/ maintenances-index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌍 Auto-update multiregion status [skip ci]" && git push)