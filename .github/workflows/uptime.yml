name: Monitor de Estado Multirregión (Uptime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-regions:
    strategy:
      matrix:
        include:
          - region: US
            os: ubuntu-latest
          - region: EU
            os: windows-latest
          - region: ASIA
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Ping a los servicios
        run: |
          # Variable con los "poderes" de curl (Follow Redirects, Insecure SSL, Fake User-Agent, Timeout 10s)
          CURL_CMD="curl -L -k -m 10 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' -o /dev/null -s -w %{http_code}"

          # 1. Chequeo Web Principal
          STATUS_WEB=$(eval $CURL_CMD "https://lasata.eu" || echo "000")
          if [ "$STATUS_WEB" -eq 200 ]; then WEB="UP"; else WEB="DOWN"; fi
          
          # 2. Chequeo Nube Privada (FileBrowser)
          STATUS_CLOUD=$(eval $CURL_CMD "https://archivos.lasata.eu" || echo "000")
          if [ "$STATUS_CLOUD" -eq 200 ]; then CLOUD="UP"; else CLOUD="DOWN"; fi
          
          # 3. Chequeo Webmail (HestiaCP)
          STATUS_MAIL=$(eval $CURL_CMD "https://webmail.lasata.eu" || echo "000")
          if [ "$STATUS_MAIL" -eq 200 ]; then MAIL="UP"; else MAIL="DOWN"; fi

          # 4. Chequeo Server S1 (HestiaCP)
          STATUS_S1=$(eval $CURL_CMD "https://s1.lasata.eu:8083" || echo "000")
          if [ "$STATUS_S1" -eq 200 ]; then S1="UP"; else S1="DOWN"; fi
          
          # Guardar resultado regional
          echo "{\"region\": \"${{ matrix.region }}\", \"web\": \"$WEB\", \"cloud\": \"$CLOUD\", \"mail\": \"$MAIL\", \"s1\": \"$S1\"}" > ${{ matrix.region }}.json

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v5
        with:
          name: result-${{ matrix.region }}
          path: ${{ matrix.region }}.json
          retention-days: 1

  merge-and-publish:
    needs: ping-regions
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Descargar artefactos regionales
        uses: actions/download-artifact@v5
        with:
          pattern: result-*
          merge-multiple: true

      - name: Unificar datos y actualizar JSON
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Extraer los datos de cada región para cada servicio
          W_US=$(jq -r '.web' US.json); W_EU=$(jq -r '.web' EU.json); W_AS=$(jq -r '.web' ASIA.json)
          C_US=$(jq -r '.cloud' US.json); C_EU=$(jq -r '.cloud' EU.json); C_AS=$(jq -r '.cloud' ASIA.json)
          M_US=$(jq -r '.mail' US.json); M_EU=$(jq -r '.mail' EU.json); M_AS=$(jq -r '.mail' ASIA.json)
          S_US=$(jq -r '.s1' US.json); S_EU=$(jq -r '.s1' EU.json); S_AS=$(jq -r '.s1' ASIA.json)

          # Reconstruir data.json con los 4 componentes
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg wu "$W_US" --arg we "$W_EU" --arg wa "$W_AS" \
            --arg cu "$C_US" --arg ce "$C_EU" --arg ca "$C_AS" \
            --arg mu "$M_US" --arg me "$M_EU" --arg ma "$M_AS" \
            --arg su "$S_US" --arg se "$S_EU" --arg sa "$S_AS" \
            '{
              components: [
                { 
                  name: "Web Principal (LASATA)", url: "https://lasata.eu", 
                  regions: { US: $wu, EU: $we, ASIA: $wa }, 
                  last_check: $ts 
                },
                { 
                  name: "Nube Privada (FileBrowser)", url: "https://archivos.lasata.eu", 
                  regions: { US: $cu, EU: $ce, ASIA: $ca }, 
                  last_check: $ts 
                },
                { 
                  name: "Webmail (HestiaCP)", url: "https://webmail.lasata.eu", 
                  regions: { US: $mu, EU: $me, ASIA: $ma }, 
                  last_check: $ts 
                },
                { 
                  name: "Server S1 (HestiaCP)", url: "https://s1.lasata.eu:8083", 
                  regions: { US: $su, EU: $se, ASIA: $sa }, 
                  last_check: $ts 
                }
              ]
            }' > data.json

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌍 Auto-update multiregion status [skip ci]" && git push)