name: Monitor de Estado Multirregión (Uptime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-regions:
    strategy:
      matrix:
        include:
          - region: US
            os: ubuntu-latest
          - region: EU
            os: windows-latest
          - region: ASIA
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Ping a los servicios y medir latencia
        run: |
          check_service() {
            local url=$1
            local res=$(curl -L -k -m 10 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' -o /dev/null -s -w "%{http_code} %{time_total}" "$url" || echo "000 0")
            local code=$(echo "$res" | awk '{print $1}')
            local time_sec=$(echo "$res" | awk '{print $2}')
            local time_ms=$(jq -n --arg t "$time_sec" '($t | tonumber * 1000) | round')

            local status="DOWN"
            if [[ "$code" =~ ^(200|301|302|403|503)$ ]]; then
              status="UP"
            fi

            echo "{\"status\": \"$status\", \"latency\": $time_ms}"
          }

          WEB_RES=$(check_service "https://lasata.eu")
          CLOUD_RES=$(check_service "https://archivos.lasata.eu")
          MAIL_RES=$(check_service "https://webmail.lasata.eu")
          S1_RES=$(check_service "https://s1.lasata.eu:8083")

          echo "{\"region\": \"${{ matrix.region }}\", \"web\": $WEB_RES, \"cloud\": $CLOUD_RES, \"mail\": $MAIL_RES, \"s1\": $S1_RES}" > ${{ matrix.region }}.json

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v5
        with:
          name: result-${{ matrix.region }}
          path: ${{ matrix.region }}.json
          retention-days: 1

  merge-and-publish:
    needs: ping-regions
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Descargar artefactos regionales
        uses: actions/download-artifact@v5
        with:
          pattern: result-*
          merge-multiple: true

      - name: Unificar datos, historial y actualizar JSON
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          W_US=$(jq -c '.web' US.json); W_EU=$(jq -c '.web' EU.json); W_AS=$(jq -c '.web' ASIA.json)
          C_US=$(jq -c '.cloud' US.json); C_EU=$(jq -c '.cloud' EU.json); C_AS=$(jq -c '.cloud' ASIA.json)
          M_US=$(jq -c '.mail' US.json); M_EU=$(jq -c '.mail' EU.json); M_AS=$(jq -c '.mail' ASIA.json)
          S_US=$(jq -c '.s1' US.json); S_EU=$(jq -c '.s1' EU.json); S_AS=$(jq -c '.s1' ASIA.json)

          if [ ! -f data.json ]; then
            echo '{"components": []}' > data.json
          fi

          OLD_DATA=$(cat data.json)

          jq -n \
            --arg ts "$TIMESTAMP" \
            --argjson wu "$W_US" --argjson we "$W_EU" --argjson wa "$W_AS" \
            --argjson cu "$C_US" --argjson ce "$C_EU" --argjson ca "$C_AS" \
            --argjson mu "$M_US" --argjson me "$M_EU" --argjson ma "$M_AS" \
            --argjson su "$S_US" --argjson se "$S_EU" --argjson sa "$S_AS" \
            --argjson old "$OLD_DATA" \
            '{
              last_check: $ts,
              components: [
                {
                  name: "Web Principal (LASATA)",
                  url: "https://lasata.eu",
                  regions: { US: $wu, EU: $we, ASIA: $wa },
                  last_check: $ts,
                  history: (($old.components[]? | select(.name == "Web Principal (LASATA)").history // []) + [{timestamp: $ts, US: $wu, EU: $we, ASIA: $wa}])[-30:]
                },
                {
                  name: "Nube Privada (FileBrowser)",
                  url: "https://archivos.lasata.eu",
                  regions: { US: $cu, EU: $ce, ASIA: $ca },
                  last_check: $ts,
                  history: (($old.components[]? | select(.name == "Nube Privada (FileBrowser)").history // []) + [{timestamp: $ts, US: $cu, EU: $ce, ASIA: $ca}])[-30:]
                },
                {
                  name: "Webmail (Roundcube Webmail)",
                  url: "https://webmail.lasata.eu",
                  regions: { US: $mu, EU: $me, ASIA: $ma },
                  last_check: $ts,
                  history: (($old.components[]? | select(.name == "Webmail (Roundcube Webmail)").history // []) + [{timestamp: $ts, US: $mu, EU: $me, ASIA: $ma}])[-30:]
                },
                {
                  name: "Server S1 (HestiaCP)",
                  url: "https://s1.lasata.eu:8083",
                  regions: { US: $su, EU: $se, ASIA: $sa },
                  last_check: $ts,
                  history: (($old.components[]? | select(.name == "Server S1 (HestiaCP)").history // []) + [{timestamp: $ts, US: $su, EU: $se, ASIA: $sa}])[-30:]
                }
              ]
            }' > data.json

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌍 Auto-update multiregion status & latency [skip ci]" && git push)