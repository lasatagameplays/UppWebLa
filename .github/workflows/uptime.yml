name: Monitor de Estado Multirregión (Uptime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-regions:
    strategy:
      matrix:
        include:
          - region: US
            os: ubuntu-latest
          - region: EU
            os: windows-latest
          - region: ASIA
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Ping a los servicios y medir latencia
        run: |
          check_service() {
            local url=$1
            local res=$(curl -L -k -m 10 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' -o /dev/null -s -w "%{http_code} %{time_total}" "$url" || echo "000 0")
            local code=$(echo "$res" | awk '{print $1}')
            local time_sec=$(echo "$res" | awk '{print $2}')
            local time_ms=$(jq -n --arg t "$time_sec" '($t | tonumber * 1000) | round')

            local status="DOWN"
            if [[ "$code" =~ ^(200|301|302|403|503)$ ]]; then
              status="UP"
            fi

            echo "{\"status\": \"$status\", \"latency\": $time_ms}"
          }

          WEB_RES=$(check_service "https://lasata.eu")
          CLOUD_RES=$(check_service "https://archivos.lasata.eu")
          MAIL_RES=$(check_service "https://webmail.lasata.eu")
          S1_RES=$(check_service "https://s1.lasata.eu:8083")

          echo "{\"region\": \"${{ matrix.region }}\", \"web\": $WEB_RES, \"cloud\": $CLOUD_RES, \"mail\": $MAIL_RES, \"s1\": $S1_RES}" > ${{ matrix.region }}.json

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v5
        with:
          name: result-${{ matrix.region }}
          path: ${{ matrix.region }}.json
          retention-days: 1

  merge-and-publish:
    needs: ping-regions
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Descargar artefactos regionales
        uses: actions/download-artifact@v5
        with:
          pattern: result-*
          merge-multiple: true

      - name: Unificar datos y generar archivos independientes por región
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          W_US=$(cat US.json | jq '.web'); W_EU=$(cat EU.json | jq '.web'); W_AS=$(cat ASIA.json | jq '.web')
          C_US=$(cat US.json | jq '.cloud'); C_EU=$(cat EU.json | jq '.cloud'); C_AS=$(cat ASIA.json | jq '.cloud')
          M_US=$(cat US.json | jq '.mail'); M_EU=$(cat EU.json | jq '.mail'); M_AS=$(cat ASIA.json | jq '.mail')
          S_US=$(cat US.json | jq '.s1'); S_EU=$(cat EU.json | jq '.s1'); S_AS=$(cat ASIA.json | jq '.s1')

          mkdir -p history

          # Función para actualizar el archivo JSON individual de cada servicio y región
          update_history_file() {
            local filepath=$1
            local status_us=$2
            local status_eu=$3
            local status_as=$4

            local old_history="[]"
            if [ -f "$filepath" ]; then
              old_history=$(cat "$filepath")
            fi

            jq -n \
              --arg ts "$TIMESTAMP" \
              --argjson us "$status_us" \
              --argjson eu "$status_eu" \
              --argjson as "$status_as" \
              --argjson old "$old_history" \
              '($old + [{timestamp: $ts, US: $us, EU: $eu, ASIA: $as}])[-30:]' > "$filepath"
          }

          update_history_file "history/web-principal.json" "$W_US" "$W_EU" "$W_AS"
          update_history_file "history/nube-privada.json" "$C_US" "$C_EU" "$C_AS"
          update_history_file "history/webmail.json" "$M_US" "$M_EU" "$M_AS"
          update_history_file "history/server-s1.json" "$S_US" "$S_EU" "$S_AS"

          # Generar data.json resumido para la vista principal
          jq -n \
            --arg ts "$TIMESTAMP" \
            --argjson wu "$W_US" --argjson we "$W_EU" --argjson wa "$W_AS" \
            --argjson cu "$C_US" --argjson ce "$C_EU" --argjson ca "$C_AS" \
            --argjson mu "$M_US" --argjson me "$M_EU" --argjson ma "$M_AS" \
            --argjson su "$S_US" --argjson se "$S_EU" --argjson sa "$S_AS" \
            '{
              last_check: $ts,
              components: [
                { name: "Web Principal (LASATA)", url: "https://lasata.eu", regions: { US: $wu, EU: $we, ASIA: $wa }, history_file: "history/web-principal.json" },
                { name: "Nube Privada (FileBrowser)", url: "https://archivos.lasata.eu", regions: { US: $cu, EU: $ce, ASIA: $ca }, history_file: "history/nube-privada.json" },
                { name: "Webmail (Roundcube Webmail)", url: "https://webmail.lasata.eu", regions: { US: $mu, EU: $me, ASIA: $ma }, history_file: "history/webmail.json" },
                { name: "Server S1 (HestiaCP)", url: "https://s1.lasata.eu:8083", regions: { US: $su, EU: $se, ASIA: $sa }, history_file: "history/server-s1.json" }
              ]
            }' > data.json

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌍 Auto-update multi-region modular history [skip ci]" && git push)