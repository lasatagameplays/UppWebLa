name: Monitor de Estado Multirregión (Uptime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-regions:
    strategy:
      matrix:
        include:
          - region: US
            os: ubuntu-latest
          - region: EU
            os: windows-latest
          - region: ASIA
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Ping a los servicios
        run: |
          # Chequeo Web
          STATUS_WEB=$(curl -o /dev/null -s -w "%{http_code}" "https://lasata.eu" || echo "000")
          if [ "$STATUS_WEB" -eq 200 ]; then WEB="UP"; else WEB="DOWN"; fi
          
          # Chequeo API
          STATUS_API=$(curl -o /dev/null -s -w "%{http_code}" "https://lasata.eu" || echo "000")
          if [ "$STATUS_API" -eq 200 ]; then API="UP"; else API="DOWN"; fi
          
          # Guardar resultado regional
          echo "{\"region\": \"${{ matrix.region }}\", \"web\": \"$WEB\", \"api\": \"$API\"}" > ${{ matrix.region }}.json

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.region }}
          path: ${{ matrix.region }}.json
          retention-days: 1

  merge-and-publish:
    needs: ping-regions
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descargar artefactos regionales
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true

      - name: Unificar datos y actualizar JSON
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Extraer los datos de cada región
          W_US=$(jq -r '.web' US.json)
          W_EU=$(jq -r '.web' EU.json)
          W_AS=$(jq -r '.web' ASIA.json)
          A_US=$(jq -r '.api' US.json)
          A_EU=$(jq -r '.api' EU.json)
          A_AS=$(jq -r '.api' ASIA.json)

          # Reconstruir data.json
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg wu "$W_US" --arg we "$W_EU" --arg wa "$W_AS" \
            --arg au "$A_US" --arg ae "$A_EU" --arg aa "$A_AS" \
            '{
              components: [
                { 
                  name: "Web Principal (LASATA)", url: "https://lasata.eu", 
                  regions: { US: $wu, EU: $we, ASIA: $wa }, 
                  last_check: $ts 
                },
                { 
                  name: "API (LASATA)", url: "https://lasata.eu", 
                  regions: { US: $au, EU: $ae, ASIA: $aa }, 
                  last_check: $ts 
                }
              ]
            }' > data.json

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌍 Auto-update multiregion status [skip ci]" && git push)