<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Sistema | LASATA.EU</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --up-color: #2ea043;
            --down-color: #f85149;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }

        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

            .lang-btn:hover {
                background: #21262d;
            }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

            .header h1 {
                margin: 0 0 0.5rem 0;
                font-size: 1.8rem;
            }

            .header p {
                margin: 0;
                color: var(--text-muted);
                font-size: 0.95rem;
            }

        .component {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        .component-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .component-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
        }

        .region-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .region-flag {
            font-size: 1.2rem;
        }

        .region-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }

        .status-up {
            background-color: rgba(46, 160, 67, 0.15);
            color: var(--up-color);
            border: 1px solid rgba(46, 160, 67, 0.4);
        }

        .status-down {
            background-color: rgba(248, 81, 73, 0.15);
            color: var(--down-color);
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }

        @media (max-width: 500px) {
            .regions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="langToggle" class="lang-btn" onclick="toggleLang()">🌐 EN</button>
    </div>

    <div class="container">
        <div class="header">
            <h1 id="ui-title">💻 Estado del Sistema</h1>
            <p id="ui-subtitle">Monitorización en tiempo real de los servicios</p>
        </div>
        <div id="status-container">
            <div class="loader" id="ui-loading">Comprobando satélites... 🛰️</div>
        </div>
    </div>

    <script>
        // Diccionario de Traducciones
        const dict = {
            es: {
                title: "💻 Estado del Sistema",
                subtitle: "Monitorización en tiempo real desde múltiples regiones",
                loading: "Comprobando satélites... 🛰️",
                error: "Error de lectura. Esperando a la primera ejecución del bot...",
                up: "En línea",
                down: "Caído",
                lastCheck: "Última comprobación: ",
                btnToggle: "🌐 EN",
                regions: { "US": "América", "EU": "Europa", "ASIA": "Asia" }
            },
            en: {
                title: "💻 System Status",
                subtitle: "Real-time multi-region monitoring",
                loading: "Checking satellites... 🛰️",
                error: "Read error. Waiting for the first GitHub Actions bot run...",
                up: "Online",
                down: "Offline",
                lastCheck: "Last check: ",
                btnToggle: "🌐 ES",
                regions: { "US": "America", "EU": "Europe", "ASIA": "Asia" }
            }
        };

        // Detección automática del idioma del navegador
        let currentLang = navigator.language.startsWith('es') ? 'es' : 'en';
        let latestData = null; // Almacenamos el JSON para no volver a descargarlo al cambiar idioma

        function updateStaticUI() {
            document.documentElement.lang = currentLang;
            document.getElementById('ui-title').innerText = dict[currentLang].title;
            document.getElementById('ui-subtitle').innerText = dict[currentLang].subtitle;
            document.getElementById('langToggle').innerText = dict[currentLang].btnToggle;

            const loader = document.getElementById('ui-loading');
            if (loader) loader.innerText = dict[currentLang].loading;
        }

        function toggleLang() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            updateStaticUI();
            if (latestData) renderData(latestData);
        }

        function renderData(data) {
            const container = document.getElementById('status-container');
            container.innerHTML = '';

            data.components.forEach(comp => {
                const date = new Date(comp.last_check);
                const locale = currentLang === 'es' ? 'es-ES' : 'en-US';
                const formattedDate = new Intl.DateTimeFormat(locale, { dateStyle: 'long', timeStyle: 'medium' }).format(date);

                let regionsHtml = '';
                const regionFlags = { "US": "🌎", "EU": "🌍", "ASIA": "🌏" };

                // Generar los 3 bloques regionales
                Object.entries(comp.regions).forEach(([regKey, regStatus]) => {
                    const isUp = regStatus === 'UP';
                    const statusClass = isUp ? 'status-up' : 'status-down';
                    const statusText = isUp ? dict[currentLang].up : dict[currentLang].down;
                    const regionName = dict[currentLang].regions[regKey];
                    const flag = regionFlags[regKey];

                    regionsHtml += `
                            <div class="region-box">
                                <span class="region-flag">${flag}</span>
                                <span class="region-name">${regionName}</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                        `;
                });

                const componentHtml = `
                        <div class="component">
                            <div class="component-header">
                                <span class="component-name">${comp.name}</span>
                                <span class="component-time">${dict[currentLang].lastCheck} ${formattedDate}</span>
                            </div>
                            <div class="regions-grid">
                                ${regionsHtml}
                            </div>
                        </div>
                    `;
                container.insertAdjacentHTML('beforeend', componentHtml);
            });
        }

        async function fetchStatus() {
            try {
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('No data');
                latestData = await response.json();
                renderData(latestData);
            } catch (error) {
                document.getElementById('status-container').innerHTML =
                    `<div class="loader" style="color: var(--down-color);">${dict[currentLang].error}</div>`;
            }
        }

        // Inicialización
        updateStaticUI();
        fetchStatus();
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
