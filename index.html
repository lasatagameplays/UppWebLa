<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Sistema | LASATA.EU</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --up-color: #2ea043;
            --down-color: #f85149;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- BARRA SUPERIOR ALINEADA --- */
        .top-bar {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between; /* Alinea logo a la izq y botón a la der */
            align-items: center; /* Los centra verticalmente */
            margin-bottom: 2rem;
        }

        .brand-logo {
            width: 1080px;
            height: 120px;
            max-width: 75%; /* Seguridad responsive para que no aplaste el botón en móviles */
            object-fit: contain;
            object-position: left; /* Alinea la imagen a la izquierda de su contenedor */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            white-space: nowrap; /* Evita que el texto del botón se rompa en dos líneas */
        }

            .lang-btn:hover {
                background: #21262d;
            }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

            .header h1 {
                margin: 0 0 0.5rem 0;
                font-size: 1.8rem;
            }

            .header p {
                margin: 0;
                color: var(--text-muted);
                font-size: 0.95rem;
            }

        .component {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        .component-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .component-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
        }

        .region-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .region-flag {
            font-size: 1.2rem;
        }

        .region-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }

        .status-up {
            background-color: rgba(46, 160, 67, 0.15);
            color: var(--up-color);
            border: 1px solid rgba(46, 160, 67, 0.4);
        }

        .status-down {
            background-color: rgba(248, 81, 73, 0.15);
            color: var(--down-color);
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }

        @media (max-width: 500px) {
            .regions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="https://github.com/lasatagameplays/UppWebLa"><img src="src/images/logo.png" alt="UppWebLa Logo" class="brand-logo"></a>
        <button id="langToggle" class="lang-btn" onclick="toggleLang()">🌐 EN</button>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-text-group">
                <h1 id="ui-title">💻 Estado del Sistema</h1>
                <p id="ui-subtitle">Monitorización en tiempo real desde múltiples regiones</p>
            </div>
        </div>

        <div id="status-container">
            <div class="loader" id="ui-loading">Comprobando satélites... 🛰️</div>
        </div>
    </div>

    <script>
        // Variables globales
        let currentLang = navigator.language.startsWith('es') ? 'es' : 'en';
        let latestData = null;
        let dict = {}; // Se llenará con el JSON descargado

        // Función para cargar el archivo JSON de idioma
        async function loadLanguage(lang) {
            try {
                // El parámetro de tiempo evita que GitHub Pages cachee el archivo de idioma
                const response = await fetch(`lang/${lang}.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Archivo de idioma no encontrado');

                dict = await response.json();
                updateStaticUI();

                // Si ya teníamos los datos de estado cargados, volvemos a renderizarlos traducidos
                if (latestData) renderData(latestData);
            } catch (error) {
                console.error("Error cargando el idioma:", error);
            }
        }

        // Actualiza los textos fijos de la interfaz
        function updateStaticUI() {
            if (!dict.title) return; // Seguridad si aún no ha cargado

            document.documentElement.lang = currentLang;
            document.getElementById('ui-title').innerText = dict.title;
            document.getElementById('ui-subtitle').innerText = dict.subtitle;
            document.getElementById('langToggle').innerText = dict.btnToggle;

            const loader = document.getElementById('ui-loading');
            if (loader) loader.innerText = dict.loading;
        }

        // Alterna entre español e inglés
        function toggleLang() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            loadLanguage(currentLang);
        }

        // Dibuja los componentes y sus estados
        function renderData(data) {
            if (!dict.regions) return; // Espera a que el diccionario cargue

            const container = document.getElementById('status-container');
            container.innerHTML = '';

            data.components.forEach(comp => {
                const date = new Date(comp.last_check);
                const locale = currentLang === 'es' ? 'es-ES' : 'en-US';
                const formattedDate = new Intl.DateTimeFormat(locale, { dateStyle: 'long', timeStyle: 'medium' }).format(date);

                let regionsHtml = '';
                const regionFlags = { "US": "🌎", "EU": "🌍", "ASIA": "🌏" };

                Object.entries(comp.regions).forEach(([regKey, regStatus]) => {
                    const isUp = regStatus === 'UP';
                    const statusClass = isUp ? 'status-up' : 'status-down';
                    const statusText = isUp ? dict.up : dict.down;
                    const regionName = dict.regions[regKey];
                    const flag = regionFlags[regKey];

                    regionsHtml += `
                            <div class="region-box">
                                <span class="region-flag">${flag}</span>
                                <span class="region-name">${regionName}</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                        `;
                });

                const componentHtml = `
                        <div class="component">
                            <div class="component-header">
                                <span class="component-name">${comp.name}</span>
                                <span class="component-time">${dict.lastCheck} ${formattedDate}</span>
                            </div>
                            <div class="regions-grid">
                                ${regionsHtml}
                            </div>
                        </div>
                    `;
                container.insertAdjacentHTML('beforeend', componentHtml);
            });
        }

        // Obtiene el estado de los servidores (data.json de GitHub Actions)
        async function fetchStatus() {
            try {
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('No data');
                latestData = await response.json();
                renderData(latestData);
            } catch (error) {
                if (dict.error) {
                    document.getElementById('status-container').innerHTML =
                        `<div class="loader" style="color: var(--down-color);">${dict.error}</div>`;
                }
            }
        }

        // SECUENCIA DE ARRANQUE INICIAL
        async function init() {
            await loadLanguage(currentLang); // 1º Carga el idioma
            await fetchStatus();             // 2º Carga el estado de los servidores
            setInterval(fetchStatus, 60000); // 3º Empieza el auto-refresco
        }

        init();
    </script>
</body>
</html>
